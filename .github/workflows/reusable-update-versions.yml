name: Reusable Update Versions

on:
  workflow_call:
    inputs:
      dry-run:
        description: Run without writing file or committing
        required: false
        type: boolean
        default: false
    secrets:
      token:
        description: GitHub token for private release lookup
        required: false
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Run without writing file or committing
        required: false
        type: boolean
        default: false
  repository_dispatch:
    types:
      - update_versions

permissions:
  contents: write

jobs:
  update-versions:
    if: ${{ github.event_name == 'workflow_call' || github.repository == 'baleen37/baleen-marketplace' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout marketplace
        uses: actions/checkout@v7

      - name: Sync all sources
        env:
          GH_TOKEN: ${{ secrets.token || secrets.BALEEN_MARKETPLACE_RELEASE_LOOKUP_TOKEN || github.token }}
          PAYLOAD_SOURCE: ${{ github.event.client_payload.source }}
          DRY_RUN: ${{ inputs.dry-run || github.event.inputs.dry-run || false }}
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          # dispatch면 해당 source만, 아니면(cron/manual) 전체
          if [[ -n "${PAYLOAD_SOURCE:-}" ]]; then
            sources=("$PAYLOAD_SOURCE")
          else
            mapfile -t sources < <(jq -r 'keys[]' sources.json)
          fi
          for s in "${sources[@]}"; do
            repo=$(jq -r --arg s "$s" '.[$s].repo' sources.json)
            [[ "$repo" == "null" ]] && { echo "skip unknown source $s"; continue; }
            git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${repo}.git" "$work/$s"
            bash scripts/discover-plugins.sh "$s" "$work/$s" \
              | bash scripts/upsert-marketplace.sh "$s" .claude-plugin/marketplace.json
            bash scripts/discover-plugins.sh "$s" "$work/$s" \
              | FORMAT=codex bash scripts/upsert-marketplace.sh "$s" .agents/plugins/marketplace.json
          done
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/marketplace.json .agents/plugins/marketplace.json
          if [[ "${DRY_RUN:-false}" == "true" ]]; then
            echo "dry-run: showing diff (skipping commit/push)"
            git --no-pager diff --staged -- .claude-plugin/marketplace.json .agents/plugins/marketplace.json
            echo "dry-run: skipping commit/push"
          else
            git commit -m "chore: sync plugins from sources" || echo "no changes"
            git push || true
          fi
