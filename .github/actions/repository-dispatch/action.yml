name: Repository dispatch
description: Trigger Baleen marketplace version synchronization from a plugin repository

inputs:
  token:
    description: Token with permission to dispatch the marketplace workflow
    required: true
  repository:
    description: Repository that owns the marketplace workflow
    required: false
    default: baleen37/baleen-marketplace
  event-type:
    description: Repository dispatch event type
    required: false
    default: update_versions
  client-payload:
    description: JSON payload sent with the dispatch event
    required: false
    default: "{}"

runs:
  using: composite
  steps:
    - name: Repository dispatch
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPOSITORY: ${{ inputs.repository }}
        EVENT_TYPE: ${{ inputs.event-type }}
        CLIENT_PAYLOAD: ${{ inputs.client-payload }}
      run: |
        set -euo pipefail

        payload=$(jq -n \
          --arg event_type "$EVENT_TYPE" \
          --argjson client_payload "$CLIENT_PAYLOAD" \
          '{event_type: $event_type, client_payload: $client_payload}')

        curl -sSf -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${GH_TOKEN}" \
          "https://api.github.com/repos/${REPOSITORY}/dispatches" \
          -d "$payload"
